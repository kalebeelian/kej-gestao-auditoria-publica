name: Gerar package-lock KEJ

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate package-lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Validate package-lock
        run: node -e "const p=require('./package-lock.json'); if(!p.lockfileVersion || !p.packages) process.exit(1); console.log('package-lock.json válido')"

      - name: Upload package-lock
        uses: actions/upload-artifact@v4
        with:
          name: KEJ-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 7
